<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whack-A-Hamster – Live-Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game">
    <h1>🔨 Whack-A-Hamster</h1>
    <div class="hud">
      <span>Punkte: <strong id="score">0</strong></span>
      <span>High-Score: <strong id="highscore">0</strong></span>
      <span>Zeit: <strong id="time">30</strong>s</span>
    </div>
    <div class="grid" id="grid"></div>
    <div id="leaderboard">
      <h2>🏆 Bestenliste</h2>
      <div class="tabs">
        <button type="button" class="tab" id="tab-global">🌍 Weltweit</button>
        <button type="button" class="tab" id="tab-local">🏠 Meine Besten</button>
      </div>
      <form id="name-form">
        <label for="player-name" id="name-label">Du bist in den Top 5! Dein Name:</label>
        <input id="player-name" maxlength="15" autocomplete="off">
        <button type="submit">Eintragen</button>
        <div id="hamster-picker">
          <span id="hamster-label">Such dir einen Hamster aus (optional):</span>
          <div id="hamster-choices"></div>
        </div>
        <small id="name-hint">Name, Punkte und Hamsterbild werden in der weltweiten Bestenliste öffentlich angezeigt.</small>
      </form>
      <table>
        <thead>
          <tr><th>Platz</th><th>Name</th><th>Punkte</th><th>Datum</th></tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
    </div>
    <p id="result"></p>
    <button id="restart">Nochmal spielen</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
