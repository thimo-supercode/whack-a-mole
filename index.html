<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whack-A-Hamster – Live-Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game">
    <h1>🔨 Whack-A-Hamster</h1>
    <div class="hud">
      <span>Punkte: <strong id="score">0</strong></span>
      <span>High-Score: <strong id="highscore">0</strong></span>
      <span>Zeit: <strong id="time">30</strong>s</span>
    </div>
    <div class="grid" id="grid"></div>
    <div id="leaderboard">
      <h2>🏆 Bestenliste</h2>
      <form id="name-form">
        <label for="player-name">Du bist in den Top 5! Dein Name:</label>
        <input id="player-name" maxlength="15" autocomplete="off">
        <button type="submit">Eintragen</button>
      </form>
      <table>
        <thead>
          <tr><th>Platz</th><th>Name</th><th>Punkte</th><th>Datum</th></tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
    </div>
    <p id="result"></p>
    <button id="restart">Nochmal spielen</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
